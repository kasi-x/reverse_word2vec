version: '3'

env:
  # Use only the pixi environment; never leak in ~/.local user site-packages
  PYTHONNOUSERSITE: '1'

vars:
  PYTHON: pixi run python

tasks:
  default:
    cmds: [task --list]

  setup:
    desc: Install dependencies via pixi
    cmds:
      - pixi install

  download-models:en:
    desc: Download English GloVe-100 word vectors
    cmds:
      - '{{.PYTHON}} -c "import gensim.downloader as api; api.load(''glove-wiki-gigaword-100'')"'

  download-analogy:
    desc: Download Google Analogy Dataset (questions-words.txt)
    cmds:
      - mkdir -p data
      - 'curl -L -o data/questions-words.txt https://raw.githubusercontent.com/nicholas-leonard/word2vec/master/questions-words.txt'

  run:ica:
    desc: "Phase 1: ICA decomposition + axis labeling"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 1'

  run:relabel:
    desc: "Re-run axis labeling on the cached ICA space (no refit)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --relabel'

  run:qualitative:
    desc: "Phase 2: Qualitative evaluation (blind + oracle)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 2'

  run:quantitative:
    desc: "Phase 3: Quantitative evaluation (antonym retrieval CV + analogy)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 3'

  run:analysis:
    desc: "Phase 4: Analysis & visualization"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 4'

  run:all:
    desc: Run full pipeline (all phases)
    cmds:
      - '{{.PYTHON}} run_pipeline.py'

  run:cf:
    desc: "Run full pipeline with counter-fitting (experimental; leak-sensitive)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --counter-fit'

  run:cf:ica:
    desc: "Phase 1 with counter-fitting (refit ICA; experimental)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 1 --counter-fit'

  eval:reranker:
    desc: "Eval: MLP + reranker antonym retrieval (CV + holdout)"
    cmds:
      - '{{.PYTHON}} scripts/eval_reranker.py'

  eval:leakfree:
    desc: "Eval: leak-free counter-fitting comparison (fold-local CF)"
    cmds:
      - '{{.PYTHON}} scripts/eval_leakfree.py'

  eval:translation:
    desc: "Eval: translation-baseline refinements (lstsq/procrustes/meandiff/negcos)"
    cmds:
      - '{{.PYTHON}} scripts/eval_translation.py'

  eval:discovery:
    desc: "Eval: train on WordNet, test on ConceptNet-only pairs"
    cmds:
      - '{{.PYTHON}} scripts/eval_discovery.py'

  paper:generate:
    desc: "Phase 5: Generate academic paper from results"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 5'

  test:
    desc: Run unit tests (pytest)
    cmds:
      - '{{.PYTHON}} -m pytest'

  lint:
    desc: Lint with ruff
    cmds:
      - '{{.PYTHON}} -m ruff check src scripts run_pipeline.py'

  format:
    desc: Format with ruff
    cmds:
      - '{{.PYTHON}} -m ruff format src scripts run_pipeline.py'
