version: '3'

vars:
  PYTHON: pixi run python

tasks:
  default:
    cmds: [task --list]

  setup:
    desc: Install dependencies via pixi
    cmds:
      - pixi install

  download-models:en:
    desc: Download English GloVe-100 word vectors
    cmds:
      - '{{.PYTHON}} -c "import gensim.downloader as api; api.load(''glove-wiki-gigaword-100'')"'

  download-analogy:
    desc: Download Google Analogy Dataset (questions-words.txt)
    cmds:
      - mkdir -p data
      - 'curl -L -o data/questions-words.txt https://raw.githubusercontent.com/nicholas-leonard/word2vec/master/questions-words.txt'

  run:ica:
    desc: "Phase 1: ICA decomposition + axis labeling"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 1'

  run:qualitative:
    desc: "Phase 2: Qualitative evaluation (canonical test cases)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 2'

  run:quantitative:
    desc: "Phase 3: Quantitative evaluation (antonym retrieval CV + analogy)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 3'

  run:analysis:
    desc: "Phase 4: Analysis & visualization"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 4'

  run:all:
    desc: Run full pipeline (all phases)
    cmds:
      - '{{.PYTHON}} run_pipeline.py'

  run:cf:
    desc: "Run full pipeline with counter-fitting"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --counter-fit'

  run:cf:ica:
    desc: "Phase 1 with counter-fitting (refit ICA)"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 1 --counter-fit'

  paper:generate:
    desc: "Phase 5: Generate academic paper from results"
    cmds:
      - '{{.PYTHON}} run_pipeline.py --phase 5'
